[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tellco-analytics"
version = "1.0.0"
description = "User overview, engagement, experience and satisfaction analytics for TellCo xDR data"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "NextHikes IT Solutions" }]
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "openpyxl>=3.1",
  "pyarrow>=14", "joblib>=1.3", "shap>=0.44", "mlflow>=2.10", "sqlalchemy>=2.0", "pymysql>=1.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "plotly>=5.18"]

[project.scripts]
tellco-run = "tellco.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tellco*"]

[tool.setuptools.package-data]
tellco = ["data/*.csv"]